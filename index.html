<style>
:root{--bg:#000;--fg:#fff;--mute:#7d7d7d;--line:rgba(255,255,255,.28);--gut:clamp(16px,4vw,64px);--h:clamp(260px,64vh,780px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wide{font-family:'Unbounded','Manrope',sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.02em}
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:18px var(--gut);background:#000}
.top .logo{font-size:13px;white-space:nowrap}
.top nav{display:flex;gap:clamp(12px,2vw,28px);overflow-x:auto;scrollbar-width:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.top nav::-webkit-scrollbar{display:none}
.top nav a{white-space:nowrap;transition:color .2s}.top nav a:hover,.top nav a.on{color:var(--fg)}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px var(--gut) 56px}
.hero h1{font-size:clamp(34px,8.2vw,140px);line-height:.98;overflow-wrap:anywhere}
.hero p{margin-top:28px;color:var(--mute);font-size:clamp(13px,1.1vw,16px);letter-spacing:.12em;text-transform:uppercase}
.block{padding:clamp(56px,9vw,120px) 0 0;scroll-margin-top:40px}
.bh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 var(--gut)}
.bh h2{font-family:'Unbounded',sans-serif;font-weight:300;text-transform:uppercase;font-size:clamp(22px,3.6vw,52px);line-height:1;letter-spacing:.02em;display:flex;align-items:flex-start;gap:.6em}
.bh .num{font:400 11px/1 'Manrope',sans-serif;letter-spacing:.1em;color:var(--mute);padding-top:.3em}
.ctl{display:flex;align-items:center;gap:10px;flex-shrink:0}
.count{font-size:12px;letter-spacing:.1em;color:var(--mute);margin-right:8px;font-variant-numeric:tabular-nums}.count b{color:var(--fg);font-weight:400}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:16px;cursor:pointer;transition:background .2s,color .2s,opacity .2s}
.arr:hover{background:var(--fg);color:var(--bg)}.arr:disabled{opacity:.25;pointer-events:none}
hr{border:0;border-top:1px solid var(--line);margin:22px var(--gut) 28px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);padding:0 var(--gut);scrollbar-width:none;overscroll-behavior-x:contain;outline:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track::after{content:'';flex:0 0 1px}
.slide{flex:0 0 auto;scroll-snap-align:start}
.slide.img{height:var(--h);cursor:zoom-in;background:#0c0c0c}
.slide.img img{display:block;height:100%;width:auto;max-width:none;user-select:none}
.slide.vid{width:min(1280px,calc(100vw - 2*var(--gut)),max(560px,calc((100vh - 300px)*16/9)))}
.slide.vid .frame{position:relative;aspect-ratio:16/9;background:#0c0c0c}
.slide.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cap{margin-top:12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
footer{margin-top:clamp(80px,12vw,160px);padding:40px var(--gut) 48px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:flex-end}
footer .big{font-size:clamp(22px,4vw,56px);line-height:1.05}
footer .links{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:13px;letter-spacing:.06em}
footer .links a{border-bottom:1px solid var(--line);padding-bottom:2px;transition:border-color .2s}footer .links a:hover{border-color:var(--fg)}
.lb{position:fixed;inset:0;z-index:50;background:#000;display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb img{max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);object-fit:contain}
.lb .arr{position:absolute;top:50%;transform:translateY(-50%)}.lb .prev{left:var(--gut)}.lb .next{right:var(--gut)}
.lb .x{position:absolute;top:18px;right:var(--gut);background:none;border:0;color:var(--fg);font:400 12px 'Manrope',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.lb .lc{position:absolute;bottom:22px;left:0;right:0;text-align:center;margin:0}
@media (max-width:700px){
 :root{--h:auto}
 .top nav{display:none}
 .slide.img{width:88vw;height:auto}.slide.img img{width:100%;height:auto}
 .track{align-items:flex-start;cursor:auto}
 .arr{width:38px;height:38px;font-size:14px}
 .bh{align-items:flex-start;flex-direction:column}
 .lb .arr{top:auto;bottom:12px;transform:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script>(function runtime() {
    var blocks = document.querySelectorAll(".block");
    var lb = document.querySelector(".lb"), lbImg = lb.querySelector("img"), lbC = lb.querySelector(".lc"), list = [], idx = 0;

    blocks.forEach(function (b) {
      var track = b.querySelector(".track"), slides = track.children;
      var cnt = b.querySelector(".count b"), prev = b.querySelector(".prev"), next = b.querySelector(".next");
      function padL() { return parseFloat(getComputedStyle(track).paddingLeft) || 0; }
      function atEnd() { return track.scrollLeft + track.clientWidth >= track.scrollWidth - 4; }
      function cur() {
        if (atEnd()) return slides.length - 1;
        var best = 0, d = Infinity, x = track.scrollLeft + padL();
        for (var i = 0; i < slides.length; i++) {
          var dd = Math.abs(slides[i].offsetLeft - track.offsetLeft - x);
          if (dd < d) { d = dd; best = i; }
        }
        return best;
      }
      function upd() {
        var i = cur();
        cnt.textContent = (i < 9 ? "0" : "") + (i + 1);
        prev.disabled = track.scrollLeft <= 2;
        next.disabled = atEnd();
      }
      function go(dir) {
        var i = Math.max(0, Math.min(slides.length - 1, cur() + dir));
        track.scrollTo({ left: slides[i].offsetLeft - track.offsetLeft - padL(), behavior: "smooth" });
      }
      prev.onclick = function () { go(-1); };
      next.onclick = function () { go(1); };
      var raf = 0;
      track.addEventListener("scroll", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(upd); }, { passive: true });
      track.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
        if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
      });
      window.addEventListener("resize", upd);
      window.addEventListener("load", upd);
      upd();

      /* перетаскивание галереи мышью */
      var down = false, sx = 0, sl = 0, moved = false;
      track.addEventListener("mousedown", function (e) {
        if (e.button !== 0) return;
        down = true; moved = false; sx = e.pageX; sl = track.scrollLeft;
      });
      window.addEventListener("mousemove", function (e) {
        if (!down) return;
        if (!moved && Math.abs(e.pageX - sx) > 5) { moved = true; track.style.scrollSnapType = "none"; track.style.scrollBehavior = "auto"; }
        if (moved) track.scrollLeft = sl - (e.pageX - sx);
      });
      window.addEventListener("mouseup", function () {
        if (!down) return; down = false;
        if (moved) { track.style.scrollSnapType = ""; track.style.scrollBehavior = ""; go(0); }
      });
      track.addEventListener("click", function (e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
      track.addEventListener("dragstart", function (e) { e.preventDefault(); });

      if (b.dataset.type === "images") {
        track.addEventListener("click", function (e) {
          var f = e.target.closest(".slide");
          if (f) openLb(b, +f.dataset.i);
        });
      }
    });

    /* лайтбокс */
    function show() {
      lbImg.src = list[idx].dataset.full;
      lbImg.alt = list[idx].alt;
      lbC.innerHTML = "<b>" + (idx < 9 ? "0" : "") + (idx + 1) + "</b> / " + (list.length < 10 ? "0" : "") + list.length;
    }
    function openLb(b, i) { list = [].slice.call(b.querySelectorAll(".slide img")); idx = i; show(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
    function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; lbImg.removeAttribute("src"); }
    function step(d) { idx = (idx + d + list.length) % list.length; show(); }
    lb.querySelector(".x").onclick = closeLb;
    lb.querySelector(".prev").onclick = function () { step(-1); };
    lb.querySelector(".next").onclick = function () { step(1); };
    lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener("keydown", function (e) {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLb();
      if (e.key === "ArrowRight") step(1);
      if (e.key === "ArrowLeft") step(-1);
    });
    var tx = 0;
    lb.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", function (e) { var d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) step(d < 0 ? 1 : -1); });

    /* подсветка пункта меню */
    var links = document.querySelectorAll(".top nav a");
    if ("IntersectionObserver" in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (en) {
          if (en.isIntersecting) links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id); });
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      blocks.forEach(function (b) { io.observe(b); });
    }
  })();</script>
